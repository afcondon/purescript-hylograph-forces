workspace:
  packageSet:
    registry: 80.8.0
  extraPackages: {}

package:
  name: hylograph-forces
  description: "d3-force's forces, and six more, in pure PureScript: held to d3-force and to a Rust kernel bit for bit"
  publish:
    version: 0.1.0
    license: MIT AND ISC
    location:
      githubOwner: afcondon
      githubRepo: purescript-hylograph-forces
  dependencies:
    - arrays
    - effect
    - either
    - foldable-traversable
    - integers
    - lists
    - maybe
    - nullable
    - numbers
    - ordered-collections
    - prelude
    - refs
    - st
    - tuples
